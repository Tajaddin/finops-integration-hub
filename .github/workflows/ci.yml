name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.10.4"

jobs:
  lint:
    name: ruff and mypy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { version: "${{ env.UV_VERSION }}", enable-cache: true }
      - run: uv sync --locked --all-extras
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run mypy

  test:
    name: unit and contract tests (coverage)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { version: "${{ env.UV_VERSION }}", enable-cache: true }
      - run: uv sync --locked --all-extras
      - run: uv run pytest -m "not integration" --cov --cov-report=xml --cov-report=term
      - uses: actions/upload-artifact@v4
        with: { name: coverage, path: coverage.xml, retention-days: 14 }

  integration:
    name: live stack (Odoo, EspoCRM, Zammad, hub)
    runs-on: ubuntu-24.04
    env:
      COMPOSE_PROFILES: core,tickets
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { version: "${{ env.UV_VERSION }}", enable-cache: true }
      - run: uv sync --locked --all-extras
      - name: local secrets and the stack
        run: |
          python3 scripts/make_env.py
          chmod 777 .secrets   # the Odoo and Zammad bootstraps write keys as their containers' users
          docker compose up -d --build
          bash scripts/wait_healthy.sh 1200
      - name: bootstrap EspoCRM (fields, role, API user, webhook to the hub)
        run: set -a && . ./.env && set +a && uv run hub migrate && uv run hub bootstrap espocrm
      - name: sync tests against the real systems
        run: set -a && . ./.env && set +a && uv run pytest -m integration -v
      - name: a seeded book end to end, twice
        run: |
          set -a && . ./.env && set +a
          mkdir -p .ci
          uv run hub seed --accounts 60 --seed 11 --out .ci/seed.json
          uv run hub sync > .ci/sync-1.json
          uv run hub sync > .ci/sync-2.json
          python3 -c "import json; r = json.load(open('.ci/sync-2.json')); assert r['created'] == 0, r"
      - name: reconciliation finds every injected fault and files each one ticket in Zammad
        run: |
          set -a && . ./.env && set +a
          docker compose stop hub   # webhooks missed while the hub is down: the reconciliation has to catch them
          uv run hub recon-eval --per-class 3 --book .ci/seed.json --out .ci/recon.json > /dev/null
          python3 - <<'PY'
          import json
          r = json.load(open(".ci/recon.json"))
          o = r["score"]["overall"]
          assert o["precision"] == 1.0 and o["recall"] == 1.0, r["score"]
          assert r["tickets_rerun"]["opened"] == 0, r["tickets_rerun"]
          print(json.dumps({"score": o, "first": r["tickets_first_run"], "rerun": r["tickets_rerun"]}))
          PY
          docker compose start hub
      - name: a deal won in EspoCRM reaches Odoo through the signed webhook
        run: set -a && . ./.env && set +a && uv run python scripts/measure_webhook.py --samples 2 --out .ci/webhook.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: integration-reports, path: .ci/, retention-days: 14 }
      - if: failure()
        run: docker compose logs --tail 200

  security:
    name: gitleaks and pip-audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: gitleaks (history and tree)
        run: bash scripts/secret_scan.sh
      - uses: astral-sh/setup-uv@v6
        with: { version: "${{ env.UV_VERSION }}", enable-cache: true }
      - run: uv sync --locked --all-extras
      - run: uv run pip-audit --skip-editable --progress-spinner off
