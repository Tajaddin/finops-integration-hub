name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.10.4"

jobs:
  lint:
    name: ruff and mypy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { version: "${{ env.UV_VERSION }}", enable-cache: true }
      - run: uv sync --locked --all-extras
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run mypy

  test:
    name: unit and contract tests (coverage)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { version: "${{ env.UV_VERSION }}", enable-cache: true }
      - run: uv sync --locked --all-extras
      - run: uv run pytest -m "not integration" --cov --cov-report=xml --cov-report=term
      - uses: actions/upload-artifact@v4
        with: { name: coverage, path: coverage.xml, retention-days: 14 }

  integration:
    name: live stack (Odoo, EspoCRM, Zammad, n8n, hub)
    runs-on: ubuntu-24.04
    env:
      COMPOSE_PROFILES: core,tickets,automation
      HUB_TRIAGE_MODEL: fake   # a deterministic stand-in: CI tests the wiring; reports/triage/ measures the model
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { version: "${{ env.UV_VERSION }}", enable-cache: true }
      - run: uv sync --locked --all-extras
      - name: triage baseline (Bitext from Hugging Face, trained on the runner)
        run: uv run hub triage-index --no-embed
      - name: local secrets and the stack
        run: |
          python3 scripts/make_env.py
          chmod 777 .secrets   # the Odoo and Zammad bootstraps write keys as their containers' users
          docker compose up -d --build
          bash scripts/wait_healthy.sh 1200
      - name: bootstrap EspoCRM (fields, role, API user, webhook to the hub)
        run: set -a && . ./.env && set +a && uv run hub migrate && uv run hub bootstrap espocrm
      - name: sync tests against the real systems
        run: set -a && . ./.env && set +a && uv run pytest -m integration -v
      - name: a seeded book end to end, twice
        run: |
          set -a && . ./.env && set +a
          mkdir -p .ci
          uv run hub seed --accounts 60 --seed 11 --out .ci/seed.json
          uv run hub sync > .ci/sync-1.json
          uv run hub sync > .ci/sync-2.json
          python3 -c "import json; r = json.load(open('.ci/sync-2.json')); assert r['created'] == 0, r"
      - name: a deal won in EspoCRM reaches Odoo through the signed webhook (before the hub is stopped below)
        run: set -a && . ./.env && set +a && uv run python scripts/measure_webhook.py --samples 2 --out .ci/webhook.json
      - name: reconciliation finds every injected fault and files each one ticket in Zammad
        run: |
          set -a && . ./.env && set +a
          docker compose stop hub   # webhooks missed while the hub is down: the reconciliation has to catch them
          uv run hub recon-eval --per-class 3 --book .ci/seed.json --out .ci/recon.json > /dev/null
          python3 - <<'PY'
          import json
          r = json.load(open(".ci/recon.json"))
          o = r["score"]["overall"]
          assert o["precision"] == 1.0 and o["recall"] == 1.0, r["score"]
          assert r["tickets_rerun"]["opened"] == 0, r["tickets_rerun"]
          assert r["baseline"]["book_data_problems_all_found"], r["baseline"]
          print(json.dumps({"score": o, "first": r["tickets_first_run"], "rerun": r["tickets_rerun"]}))
          PY
          docker compose start hub
      - name: the n8n workflows exported in the repo are what n8n holds after import
        run: |
          uv run python scripts/export_n8n.py
          git diff --exit-code -- n8n/workflows
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: integration-reports, path: .ci/, retention-days: 14 }
      - if: failure()
        run: docker compose logs --tail 200

  observability:
    name: alert rules (promtool) and dashboard
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: rules check and unit tests
        run: |
          docker run --rm -v "$PWD/observability:/w" -w /w --entrypoint promtool prom/prometheus:v3.5.0 check rules alert_rules.yml
          docker run --rm -v "$PWD/observability:/w" -w /w --entrypoint promtool prom/prometheus:v3.5.0 test rules alerts_test.yml
      - name: the committed dashboard is the generated one
        run: python3 scripts/make_dashboard.py && git diff --exit-code -- observability/grafana

  terraform:
    name: Terraform fmt, validate, tflint, trivy
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: "1.16.6" }
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false && terraform validate
      - name: tflint
        run: docker run --rm -v "$PWD:/data" -t ghcr.io/terraform-linters/tflint:v0.59.1 --chdir=/data
      - name: trivy (misconfiguration)
        run: docker run --rm -v "$PWD:/src" aquasec/trivy:0.67.2 config --exit-code 1 --severity HIGH,CRITICAL /src

  image:
    name: hub image build and scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f docker/hub.Dockerfile -t finops-integration-hub:ci .
      - name: trivy (vulnerabilities with a fix)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.67.2 image \
            --exit-code 1 --severity CRITICAL --ignore-unfixed finops-integration-hub:ci
      - name: runs as a non-root user
        run: test "$(docker inspect -f '{{.Config.User}}' finops-integration-hub:ci)" = "hub"

  salesforce:
    name: Salesforce metadata converts (sf CLI)
    runs-on: ubuntu-24.04
    env:
      SF_DISABLE_TELEMETRY: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npx --yes @salesforce/cli@2 project convert source --root-dir force-app --output-dir "$RUNNER_TEMP/mdapi"
        working-directory: salesforce
      - run: test -f "$RUNNER_TEMP/mdapi/objects/Opportunity.object" && grep -c "<fullName>" "$RUNNER_TEMP/mdapi/objects/Opportunity.object"

  security:
    name: gitleaks and pip-audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: gitleaks (history and tree)
        run: bash scripts/secret_scan.sh
      - uses: astral-sh/setup-uv@v6
        with: { version: "${{ env.UV_VERSION }}", enable-cache: true }
      - run: uv sync --locked --all-extras
      - run: uv run pip-audit --skip-editable --progress-spinner off
