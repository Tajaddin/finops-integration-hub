# Local stack. `make up` starts everything; CI starts subsets by profile. Every port binds to 127.0.0.1.
#   core        Postgres, Odoo (ERP), EspoCRM (CRM), Mailpit, the hub
#   tickets     Zammad (Elasticsearch disabled, ADR 0004)
#   automation  n8n
#   llm         Langfuse (web, worker, ClickHouse, Redis, MinIO); the model runs in Ollama on the host
#   obs         Prometheus and Grafana
name: finops

x-hub-env: &hub-env
  HUB_DATABASE_URL: postgresql://hub:${HUB_DB_PASSWORD}@pg:5432/hub
  HUB_ODOO_URL: http://odoo:8069
  HUB_ODOO_DATABASE: odoo
  HUB_ODOO_API_KEY_FILE: /secrets/odoo_api_key
  HUB_ESPOCRM_URL: http://espocrm
  HUB_ESPOCRM_API_KEY_FILE: /secrets/espocrm_api_key
  HUB_ESPOCRM_WEBHOOK_SECRET_FILE: /secrets/espocrm_webhook_secret
  HUB_ZAMMAD_URL: http://zammad-nginx:8080
  HUB_ZAMMAD_TOKEN_FILE: /secrets/zammad_token
  HUB_API_KEY: ${HUB_API_KEY}
  HUB_CRM: ${HUB_CRM:-espocrm}
  HUB_TICKETS: ${HUB_TICKETS:-zammad}
  HUB_OLLAMA_URL: http://host.docker.internal:11434
  HUB_TRIAGE_MODEL: ${HUB_TRIAGE_MODEL:-qwen2.5:7b}
  HUB_EMBED_MODEL: ${HUB_EMBED_MODEL:-nomic-embed-text}
  HUB_LANGFUSE_URL: http://langfuse-web:3000
  LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
  LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
  HUB_SMTP_HOST: mailpit
  HUB_LOG_LEVEL: ${HUB_LOG_LEVEL:-INFO}

x-zammad: &zammad-service
  image: ghcr.io/zammad/zammad:7.2.2-0016
  init: true
  restart: unless-stopped
  profiles: [tickets]
  environment: &zammad-environment
    POSTGRESQL_HOST: pg
    POSTGRESQL_PORT: "5432"
    POSTGRESQL_DB: zammad
    POSTGRESQL_USER: zammad
    POSTGRESQL_PASS: ${ZAMMAD_DB_PASSWORD}
    POSTGRESQL_OPTIONS: "?pool=20"
    POSTGRESQL_DB_CREATE: "false"
    MEMCACHE_SERVERS: zammad-memcached:11211
    REDIS_URL: redis://zammad-redis:6379
    ELASTICSEARCH_ENABLED: "false"
    ZAMMAD_FQDN: 127.0.0.1:8081
    ZAMMAD_HTTP_TYPE: http
    ZAMMAD_WEB_CONCURRENCY: "1"
    TZ: UTC
  volumes:
    - zammad-storage:/opt/zammad/storage
  depends_on: &zammad-deps
    pg: { condition: service_healthy }
    zammad-memcached: { condition: service_healthy }
    zammad-redis: { condition: service_healthy }

services:
  pg:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      ODOO_DB_PASSWORD: ${ODOO_DB_PASSWORD}
      HUB_DB_PASSWORD: ${HUB_DB_PASSWORD}
      N8N_DB_PASSWORD: ${N8N_DB_PASSWORD}
      ZAMMAD_DB_PASSWORD: ${ZAMMAD_DB_PASSWORD}
      LANGFUSE_DB_PASSWORD: ${LANGFUSE_DB_PASSWORD}
      ESPOCRM_DB_PASSWORD: ${ESPOCRM_DB_PASSWORD}
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sh:/docker-entrypoint-initdb.d/10-databases.sh:ro
    ports: ["127.0.0.1:55432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    profiles: [core]

  odoo-init:
    image: odoo:19.0-20261015
    entrypoint: ["bash", "/bootstrap/init.sh"]
    environment: &odoo-env
      HOST: pg
      USER: odoo
      PASSWORD: ${ODOO_DB_PASSWORD}
      ODOO_ADMIN_PASSWORD: ${ODOO_ADMIN_PASSWORD}
    volumes:
      - ./docker/odoo/odoo.conf:/etc/odoo/odoo.conf:ro
      - ./docker/odoo:/bootstrap:ro
      - ./.secrets:/secrets
      - odoo-data:/var/lib/odoo
    depends_on:
      pg: { condition: service_healthy }
    profiles: [core]

  odoo:
    image: odoo:19.0-20261015
    environment: *odoo-env
    volumes:
      - ./docker/odoo/odoo.conf:/etc/odoo/odoo.conf:ro
      - odoo-data:/var/lib/odoo
    ports: ["127.0.0.1:8069:8069"]
    depends_on:
      odoo-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8069/web/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped
    profiles: [core]

  espocrm:
    image: espocrm/espocrm:10.0.10-apache
    environment: &espo-env
      ESPOCRM_DATABASE_PLATFORM: Postgresql
      ESPOCRM_DATABASE_HOST: pg
      ESPOCRM_DATABASE_PORT: "5432"
      ESPOCRM_DATABASE_NAME: espocrm
      ESPOCRM_DATABASE_USER: espocrm
      ESPOCRM_DATABASE_PASSWORD: ${ESPOCRM_DB_PASSWORD}
      ESPOCRM_ADMIN_USERNAME: admin
      ESPOCRM_ADMIN_PASSWORD: ${ESPOCRM_ADMIN_PASSWORD}
      ESPOCRM_SITE_URL: http://127.0.0.1:8080
    volumes: &espo-volumes
      - espocrm-data:/var/www/html/data
      - espocrm-custom:/var/www/html/custom
      - espocrm-client-custom:/var/www/html/client/custom
    ports: ["127.0.0.1:8080:80"]
    depends_on:
      pg: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "bin/command app-check || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped
    profiles: [core]

  espocrm-daemon:
    # runs EspoCRM's scheduled jobs, including the webhook queue that delivers Opportunity events
    image: espocrm/espocrm:10.0.10-apache
    entrypoint: docker-daemon.sh
    environment: *espo-env
    volumes: *espo-volumes
    depends_on:
      espocrm: { condition: service_healthy }
    restart: unless-stopped
    profiles: [core]

  espocrm-config:
    # allow-lists the hub as a webhook target (EspoCRM blocks private addresses by default)
    image: espocrm/espocrm:10.0.10-apache
    entrypoint: ["php", "/bootstrap/allow-webhooks.php", "hub:8000"]
    environment: *espo-env
    volumes:
      - espocrm-data:/var/www/html/data
      - espocrm-custom:/var/www/html/custom
      - espocrm-client-custom:/var/www/html/client/custom
      - ./docker/espocrm:/bootstrap:ro
    depends_on:
      espocrm: { condition: service_healthy }
    restart: "no"
    profiles: [core]

  hub:
    build: { context: ., dockerfile: docker/hub.Dockerfile }
    image: finops-integration-hub:local
    environment: *hub-env
    volumes: ["./.secrets:/secrets:ro"]
    ports: ["127.0.0.1:8000:8000"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      pg: { condition: service_healthy }
      odoo: { condition: service_healthy }
      espocrm: { condition: service_healthy }
    restart: unless-stopped
    profiles: [core]

  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["127.0.0.1:8025:8025", "127.0.0.1:1025:1025"]
    restart: unless-stopped
    profiles: [core]

  # --- tickets: Zammad (upstream zammad-docker-compose, Elasticsearch disabled, the shared Postgres) ---------------
  zammad-init:
    <<: *zammad-service
    command: ["zammad-init"]
    restart: on-failure
    user: "0:0"
    depends_on: *zammad-deps

  zammad-bootstrap:
    <<: *zammad-service
    command: ["bundle", "exec", "rails", "r", "/bootstrap/bootstrap.rb"]
    restart: "no"
    user: "0:0"
    environment:
      <<: *zammad-environment
      ZAMMAD_ADMIN_PASSWORD: ${ZAMMAD_ADMIN_PASSWORD}
    volumes:
      - zammad-storage:/opt/zammad/storage
      - ./docker/zammad:/bootstrap:ro
      - ./.secrets:/secrets
    depends_on:
      zammad-init: { condition: service_completed_successfully }

  zammad-railsserver:
    <<: *zammad-service
    command: ["zammad-railsserver"]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:3000"]
      interval: 15s
      timeout: 5s
      start_period: 120s
      retries: 10
    depends_on:
      zammad-bootstrap: { condition: service_completed_successfully }

  zammad-scheduler:
    <<: *zammad-service
    command: ["zammad-scheduler"]
    depends_on:
      zammad-bootstrap: { condition: service_completed_successfully }

  zammad-websocket:
    <<: *zammad-service
    command: ["zammad-websocket"]
    depends_on:
      zammad-bootstrap: { condition: service_completed_successfully }

  zammad-nginx:
    <<: *zammad-service
    command: ["zammad-nginx"]
    init: false
    ports: ["127.0.0.1:8081:8080"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -o /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 10
    depends_on:
      zammad-railsserver: { condition: service_healthy }

  zammad-memcached:
    image: memcached:1.6.45-alpine
    command: memcached -m 128M
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "11211"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    profiles: [tickets]

  zammad-redis:
    image: redis:8.10.2-alpine
    volumes: [zammad-redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    profiles: [tickets]

volumes:
  pg-data:
  odoo-data:
  espocrm-data:
  espocrm-custom:
  espocrm-client-custom:
  zammad-storage:
  zammad-redis-data:
