[options]
; The connection (host, user, password) comes from the image's HOST/USER/PASSWORD environment variables.
addons_path = /usr/lib/python3/dist-packages/odoo/addons
data_dir = /var/lib/odoo
db_name = odoo
dbfilter = ^odoo$
; no database manager: nobody can create, drop or dump a database over HTTP
list_db = False
proxy_mode = True
workers = 4
max_cron_threads = 1
limit_time_real = 300
log_level = info
without_demo = True
